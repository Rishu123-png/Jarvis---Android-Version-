# Codemagic CI/CD configuration for J.A.R.V.I.S.
#
# Two workflows:
#   * android-debug   — zero setup. Builds an installable debug APK immediately.
#   * android-release — stable signature. Same key on every build, so a new APK installs
#                       straight over the previous one with no "package conflicts" error.
#
# IMPORTANT — instance type:
#   Codemagic's FREE plan only includes macOS machines. `linux_x2` (and mac_mini_m4, linux_x4,
#   windows_x2) are gated behind billing, and using them on a free account fails before the build
#   starts with "The selected instance type is not available with the current billing plan".
#   mac_mini_m2 builds Android perfectly well, so that is what these workflows use.
#   If you enable billing, switch both to `instance_type: linux_x2` for cheaper/faster Android runs.
#
# Shell scripts here stay POSIX-portable (openssl instead of `base64 --decode`, tool paths resolved
# through globs) so they behave identically on the macOS and Linux images.

workflows:
  # ---------------------------------------------------------------------------------------
  # DEBUG — works with no keystore, no secrets, no paid machine. Start here.
  # ---------------------------------------------------------------------------------------
  android-debug:
    name: JARVIS · debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Resolve Android SDK tools
        # Never fatal: images differ in where cmdline-tools and build-tools live.
        script: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools"
          # Add every build-tools revision (apksigner, aapt2).
          for bt in "$SDK"/build-tools/*; do
            [ -d "$bt" ] && PATH="$PATH:$bt"
          done
          export PATH
          echo "PATH=$PATH" >> "$CM_ENV"
          command -v sdkmanager || echo "::warning::sdkmanager not found; relying on the preinstalled SDK"
      - name: Accept SDK licences
        script: |
          ( yes | sdkmanager --licenses > /dev/null 2>&1 ) || true
          echo "licences handled"
      - name: Ensure SDK components
        # Never fatal: Codemagic images already ship platform 34 and build-tools 34.
        script: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK components ready"
      - name: Build debug APK
        script: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build-debug.log
      - name: Report signature
        script: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          if [ -n "$APK" ]; then
            (apksigner verify --print-certs "$APK" || true) | head -8
            APKSIGNER=$(command -v apksigner || true)
            [ -n "$APKSIGNER" ] && echo "signed with apksigner at $APKSIGNER"
          else
            echo "::error::No debug APK was produced"
            exit 1
          fi
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - build-debug.log
    # Uncomment and set your address to get the APK emailed to you.
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: true

  # ---------------------------------------------------------------------------------------
  # RELEASE — stable key. Create a keystore in Codemagic
  # (Team settings -> Code signing identities -> Android keystore); it is injected as the
  # keystore_credentials group. With no keystore the build still succeeds and falls back to
  # debug signing, with a loud warning in the log.
  # ---------------------------------------------------------------------------------------
  android-release:
    name: JARVIS · release APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - keystore_credentials # CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Resolve Android SDK tools
        script: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools"
          for bt in "$SDK"/build-tools/*; do
            [ -d "$bt" ] && PATH="$PATH:$bt"
          done
          export PATH
          echo "PATH=$PATH" >> "$CM_ENV"
          command -v sdkmanager || echo "::warning::sdkmanager not found; relying on the preinstalled SDK"
      - name: Accept SDK licences
        script: |
          ( yes | sdkmanager --licenses > /dev/null 2>&1 ) || true
          echo "licences handled"
      - name: Ensure SDK components
        script: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK components ready"
      - name: Materialise keystore
        script: |
          set -e
          rm -f "$CM_BUILD_DIR/keystore.jks"

          # Codemagic normally exposes CM_KEYSTORE_PATH (already a file on disk).
          if [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            cp "$CM_KEYSTORE_PATH" "$CM_BUILD_DIR/keystore.jks"
            echo "Keystore copied from CM_KEYSTORE_PATH"
          else
            # Base64 decode that works on both GNU and BSD (macOS) — never `base64 --decode`.
            if [ -n "$CM_KEYSTORE" ]; then
              printf '%s' "$CM_KEYSTORE" | openssl base64 -d -A > "$CM_BUILD_DIR/keystore.jks"
              echo "Keystore decoded from CM_KEYSTORE"
            elif [ -n "$JARVIS_KEYSTORE" ]; then
              printf '%s' "$JARVIS_KEYSTORE" | openssl base64 -d -A > "$CM_BUILD_DIR/keystore.jks"
              echo "Keystore decoded from JARVIS_KEYSTORE"
            fi
          fi

          if [ -s "$CM_BUILD_DIR/keystore.jks" ]; then
            echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/keystore.jks" >> "$CM_ENV"
            echo "Keystore ready ($(wc -c < "$CM_BUILD_DIR/keystore.jks" | tr -d ' ') bytes)"
          else
            rm -f "$CM_BUILD_DIR/keystore.jks"
            echo "::warning::No keystore found. The release APK will be debug-signed."
            echo "::warning::Add one in Team settings -> Code signing identities -> Android keystore."
          fi
      - name: Build release APK
        script: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build-release.log
      - name: Verify signature
        script: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          if [ -n "$APK" ]; then
            (apksigner verify --print-certs "$APK" || true) | head -10
            echo "---- package ----"
            (aapt2 dump badging "$APK" 2>/dev/null || aapt dump badging "$APK" 2>/dev/null || true) | head -6
          else
            echo "::error::No release APK was produced"
            exit 1
          fi
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - build-release.log
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: true
