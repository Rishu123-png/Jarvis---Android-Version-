name: Build JARVIS APK

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Installed directly rather than via a marketplace action so the toolchain is explicit
      # and nothing depends on a third-party action's node runtime.
      - name: Install Android SDK
        run: |
          set -o pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/build-tools/34.0.0:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # Both build types are compiled: debug proves the app assembles, release proves the
      # signing fallback works so Codemagic's release workflow cannot fail on a missing keystore.
      # Guards codemagic.yaml: valid YAML, and every script step is POSIX-clean so it behaves the
      # same on Codemagic's macOS and Linux images.
      - name: Validate codemagic.yaml
        run: |
          python3 - <<'EOF'
          import subprocess, sys, tempfile, os, yaml
          doc = yaml.safe_load(open("codemagic.yaml"))
          assert "workflows" in doc, "no workflows key"
          failures = 0
          for wf, spec in doc["workflows"].items():
              inst = spec.get("instance_type")
              print(f"{wf}: instance_type={inst}")
              if inst in ("linux_x2", "linux_x4", "windows_x2", "mac_mini_m4"):
                  print(f"::error::{wf} uses {inst}, which needs Codemagic billing enabled")
                  failures += 1
              for step in spec.get("scripts", []):
                  with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as f:
                      f.write("#!/bin/sh\n" + step["script"])
                      path = f.name
                  r = subprocess.run(["sh", "-n", path], capture_output=True, text=True)
                  status = "ok" if r.returncode == 0 else "FAIL"
                  print(f"  [{status}] {step['name']}")
                  if r.returncode != 0:
                      print(r.stderr)
                      failures += 1
                  os.unlink(path)
          sys.exit(1 if failures else 0)
          EOF

      - name: Build debug + release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Verify APK signatures and manifest (launcher intent filters)
        run: |
          OUT="$GITHUB_STEP_SUMMARY"
          echo "## APK verification" >> "$OUT"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            echo "### $apk" >> "$OUT"
            echo '```' >> "$OUT"
            "$BT/apksigner" verify --print-certs "$apk" 2>&1 | head -6 | tee -a "$OUT"
            "$BT/aapt2" dump badging "$apk" 2>&1 \
              | grep -E "^package:|launchable-activity|HOME|LAUNCHER" | head -8 | tee -a "$OUT"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" 2>/dev/null \
              | grep -iE "android.intent.category.(HOME|LAUNCHER|DEFAULT)" | head -6 | tee -a "$OUT"
            echo '```' >> "$OUT"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # Surfaces the compiler output on the commit so failures are readable without
      # downloading log bundles.
      - name: Report build log on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(tail -c 45000 build.log 2>/dev/null || echo "build.log was not produced")
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(printf '### JARVIS build log (tail)\n\n```\n%s\n```\n' "$BODY")" || true
