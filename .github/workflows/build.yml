name: Build JARVIS APK

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Installed directly rather than via a marketplace action so the toolchain is explicit
      # and nothing depends on a third-party action's node runtime.
      - name: Install Android SDK
        run: |
          set -o pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/build-tools/34.0.0:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # Both build types are compiled: debug proves the app assembles, release proves the
      # signing fallback works so Codemagic's release workflow cannot fail on a missing keystore.
      # Guards codemagic.yaml: valid YAML, and every script step is POSIX-clean so it behaves the
      # same on Codemagic's macOS and Linux images.
      - name: Validate codemagic.yaml
        run: |
          python3 - <<'EOF'
          import subprocess, sys, tempfile, os, yaml
          doc = yaml.safe_load(open("codemagic.yaml"))
          assert "workflows" in doc, "no workflows key"
          failures = 0
          for wf, spec in doc["workflows"].items():
              inst = spec.get("instance_type")
              print(f"{wf}: instance_type={inst}")
              if inst in ("linux_x2", "linux_x4", "windows_x2", "mac_mini_m4"):
                  print(f"::error::{wf} uses {inst}, which needs Codemagic billing enabled")
                  failures += 1
              for step in spec.get("scripts", []):
                  with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as f:
                      f.write("#!/bin/sh\n" + step["script"])
                      path = f.name
                  r = subprocess.run(["sh", "-n", path], capture_output=True, text=True)
                  status = "ok" if r.returncode == 0 else "FAIL"
                  print(f"  [{status}] {step['name']}")
                  if r.returncode != 0:
                      print(r.stderr)
                      failures += 1
                  os.unlink(path)
          sys.exit(1 if failures else 0)
          EOF

      # The checks no compiler can make: the numbers the docs claim must match the enums they
      # describe, the Shizuku pin must match the URL the phone falls back to, no new plaintext
      # address may appear in code, and no exported receiver may listen only to the system.
      # Runs first because it costs about a second and catches a whole class of silent drift.
      - name: Repository guard
        run: python3 tools/guard.py

      # Tests run before the APKs are built: a failing test should stop the release, and the
      # androidTest sources are compiled so they cannot rot without anyone noticing.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest 2>&1 | tee build.log

      - name: Build debug + release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain -PrequireShizuku=true -PrequireVoskModel=true \
            assembleDebug assembleRelease assembleDebugAndroidTest 2>&1 | tee -a build.log

      # Android lint has never been run over this codebase, so it starts as a report rather than a
      # gate: `abortOnError` is off in app/build.gradle.kts and the HTML is uploaded for triage.
      # Once the report is clean (or a baseline is committed), turn `abortOnError` back on, delete
      # the line below, and lint joins the tests as something that can stop a release.
      - name: Android lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon --console=plain lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify APK signatures and manifest (launcher intent filters)
        run: |
          OUT="$GITHUB_STEP_SUMMARY"
          echo "## APK verification" >> "$OUT"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            echo "### $apk" >> "$OUT"
            echo '```' >> "$OUT"
            "$BT/apksigner" verify --print-certs "$apk" 2>&1 | head -6 | tee -a "$OUT"
            "$BT/aapt2" dump badging "$apk" 2>&1 \
              | grep -E "^package:|launchable-activity|HOME|LAUNCHER" | head -8 | tee -a "$OUT"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" 2>/dev/null \
              | grep -iE "android.intent.category.(HOME|LAUNCHER|DEFAULT)" | head -6 | tee -a "$OUT"
            echo '```' >> "$OUT"

            # Shizuku must be inside the shipped APK: it is what the system switches need.
            SHIZUKU=$(unzip -l "$apk" | grep -c "assets/shizuku/shizuku.apk")
            if [ "$SHIZUKU" != "1" ]; then
              echo "::error::Shizuku is missing from $apk"
              exit 1
            fi
            echo "Shizuku bundled: $(unzip -l "$apk" | awk '/assets\/shizuku\/shizuku.apk/ {print $1}') bytes" | tee -a "$OUT"

            # The offline voice model must be inside the APK. Installing the build is the whole
            # download: the wake word cannot ask the operator for a second file after that.
            VOSK=$(unzip -l "$apk" | grep -c "assets/model-en-us/am/final.mdl")
            if [ "$VOSK" != "1" ]; then
              echo "::error::The offline voice model is missing from $apk"
              exit 1
            fi
            echo "Voice model bundled: $(unzip -l "$apk" | awk '/assets\/model-en-us\/am\/final.mdl/ {print $1}') bytes" | tee -a "$OUT"
          done

      - name: Unit test report
        if: always()
        run: |
          OUT="$GITHUB_STEP_SUMMARY"
          echo "## Unit tests" >> "$OUT"
          python3 - <<'EOF' >> "$OUT"
          import glob, xml.etree.ElementTree as ET
          rows, total, failed = [], 0, 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for suite in ([root] if root.tag == "testsuite" else root.iter("testsuite")):
                  name = suite.get("name", "?")
                  t = int(suite.get("tests", 0)); f = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  total += t; failed += f
                  rows.append((name.split(".")[-1], t, f))
          print(f"{total} tests, {failed} failed\n")
          print("| Suite | Tests | Failed |")
          print("| --- | --- | --- |")
          for name, t, f in sorted(rows):
              print(f"| {name} | {t} | {f} |")
          EOF

      # Releases need a file name a human can trust. The version is read from the Gradle file so it can
      # never disagree with the build, and the name is stable across machines.
      - name: Name the APKs for release
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          mkdir -p dist
          # The version name moves only when a version is released; the code moves on every build.
          # Both are in the file name, so two APKs can never disagree about which is newer.
          cp app/build/outputs/apk/release/app-release.apk "dist/jarvis-$VERSION-b$CODE.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/jarvis-$VERSION-b$CODE-debug.apk"
          ls -lh dist
          echo "## APK names" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Version | code |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| jarvis-$VERSION-b$CODE.apk | $VERSION | $CODE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| jarvis-$VERSION-b$CODE-debug.apk | $VERSION-debug | $CODE |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: dist/jarvis-*.apk
          if-no-files-found: error
          retention-days: 30

      # The exact files a GitHub Release should carry. Both are attached automatically on a v* tag.
      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "JARVIS ${{ env.VERSION }} · build ${{ env.CODE }}"
          body: |
            **JARVIS ${{ env.VERSION }} · versionCode ${{ env.CODE }}.**

            Install this over an older JARVIS — the signing key is the same, so it upgrades in place,
            and your routines, memory and settings survive.

            | File | What it is |
            |---|---|
            | `jarvis-${{ env.VERSION }}-b${{ env.CODE }}.apk` | **The release build.** Install this one. |
            | `jarvis-${{ env.VERSION }}-b${{ env.CODE }}-debug.apk` | The same app with debugging enabled. |

            Requires Android 10 or newer. Nothing is downloaded at runtime: the offline voice model,
            Shizuku and the OCR engine are inside the APK.

            What changed in this version is in `CHANGELOG.md`, under
            **${{ env.VERSION }} — versionCode ${{ env.CODE }}** — the same text the app's own
            release history uses, so the notes here and the notes there cannot drift apart. The
            details are written by hand and checked by `tools/guard.py`, which refuses a release
            whose version, badge, roadmap line and changelog entry disagree.

            Worth checking on your phone, because only a phone can settle it: whether the Wi-Fi,
            Bluetooth and data switches flip on your ROM, how the orb feels, whether the wake word
            catches a fast sentence, and whether your provider streams or falls back.
          files: |
            dist/jarvis-*.apk


      # Surfaces the compiler output on the commit so failures are readable without
      # downloading log bundles.
      - name: Report build log on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(tail -c 45000 build.log 2>/dev/null || echo "build.log was not produced")
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(printf '### JARVIS build log (tail)\n\n```\n%s\n```\n' "$BODY")" || true
